<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ოჯახის ბიუჯეტი</title>
<meta name="description" content="ოჯახის ბიუჯეტის დაგეგმვისა და კონტროლის აპლიკაცია">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ბიუჯეტი">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="app-header__row">
      <h1 class="app-header__title">ოჯახის ბიუჯეტი</h1>
      <span id="sync-dot" class="sync-dot" role="status" hidden></span>
    </div>
    <div class="app-header__backup-banner" id="backup-banner" hidden></div>
    <div class="sync-banner" id="sync-banner" role="alert" hidden></div>
  </header>

  <main id="view-root" class="view-root" aria-live="polite"></main>

  <nav class="tab-bar" id="tab-bar" aria-label="ნავიგაცია">
    <button class="tab-bar__item" data-route="dashboard" aria-current="page">
      <span class="tab-bar__icon" aria-hidden="true">🏠</span>
      <span class="tab-bar__label">დეშბორდი</span>
    </button>
    <button class="tab-bar__item" data-route="transactions">
      <span class="tab-bar__icon" aria-hidden="true">💳</span>
      <span class="tab-bar__label">ტრანზაქციები</span>
    </button>
    <button class="tab-bar__item" data-route="templates">
      <span class="tab-bar__icon" aria-hidden="true">🧾</span>
      <span class="tab-bar__label">შაბლონები</span>
    </button>
    <button class="tab-bar__item" data-route="categories">
      <span class="tab-bar__icon" aria-hidden="true">🏷️</span>
      <span class="tab-bar__label">კატეგორიები</span>
    </button>
    <button class="tab-bar__item" data-route="settings">
      <span class="tab-bar__icon" aria-hidden="true">⚙️</span>
      <span class="tab-bar__label">პარამეტრები</span>
    </button>
  </nav>
</div>

<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
